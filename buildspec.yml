version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - cd src/ui
      - npm install
  build:
    commands:
      - npm run build
  post_build:
    commands:
      - |
        if [ -n "${S3_BUCKET}" ]; then
          aws s3 sync dist/ "s3://${S3_BUCKET}" --delete
          if [ -n "${CLOUDFRONT_DISTRIBUTION_ID}" ]; then
            aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"
          else
            echo "CLOUDFRONT_DISTRIBUTION_ID not set; skipping invalidation."
          fi
        else
          echo "S3_BUCKET not set; skipping deploy."
        fi
artifacts:
  base-directory: src/ui/dist
  files:
    - '**/*'
