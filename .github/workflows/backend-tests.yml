name: Backend Tests

on:
  push:
    paths:
      - "src/api/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "src/api/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/api/package-lock.json

      - name: Install
        run: npm install

      - name: Test
        run: npm test
